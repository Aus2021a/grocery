<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations & Team Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 sm:p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-slate-900 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Labor & Load Operations</h1>
        <p class="text-slate-400 text-sm">Real-time team performance & schedule tracking</p>
      </div>
      <span class="bg-green-500/20 text-green-300 text-xs px-3 py-1 rounded-full font-semibold border border-green-500/30">Active</span>
    </header>

    <!-- Metrics Summary -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Total Load (Cartons)</p>
        <p class="text-3xl font-bold text-slate-900 mt-1" id="totalLoad">1,850</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Rostered Hours</p>
        <p class="text-3xl font-bold text-slate-900 mt-1" id="rosteredHours">38.5 hrs</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Target Rate</p>
        <p class="text-3xl font-bold text-emerald-600 mt-1" id="targetRate">52 CPH</p>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Required vs. Rostered Hours</h2>
      <div class="relative h-64">
        <canvas id="varianceChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const ctx = document.getElementById('varianceChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [
          { label: 'Required Hours', data: [32, 35, 40, 38, 42, 30, 28], backgroundColor: '#3b82f6' },
          { label: 'Rostered Hours', data: [30, 36, 38, 40, 40, 32, 26], backgroundColor: '#10b981' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } }
      }
    });
  </script>
</body>
</html>
